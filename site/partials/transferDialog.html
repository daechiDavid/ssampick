<dialog class="dialog dialog-text" id="transferDialog" aria-labelledby="transferTitle">
    <form method="dialog"><button class="dialog-close" type="submit" aria-label="닫기"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button></form>
    <div class="dialog-content">
      <h2 id="transferTitle">개인정보 국외 이전 동의</h2>
      <p>문의 전송 시 Google Apps Script가 문의 내용을 처리하여 지정된 Gmail 수신함으로 발송합니다. 이전받는 자별 상세 정보는 아래와 같습니다.</p>
      <div data-transfer-details><p>이전 국가·수탁자 연락처·보유기간 등 운영 정보를 확인 중입니다. 확인 전에는 문의를 전송하지 않습니다.</p></div>
      <h3>거부 방법 및 영향</h3><p>국외 이전 동의란을 선택하지 않으면 이전을 거부할 수 있습니다. 거부 시 이 온라인 양식을 통한 문의 전송은 이용할 수 없습니다. 동의 후 철회는 개인정보 문의 이메일로 요청할 수 있습니다.</p>
    </div>
  </dialog>
